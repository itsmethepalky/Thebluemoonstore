<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Admin | The Blue Moon</title>
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="store-body">

<header class="store-header">
  <div class="store-header-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><i class="bi bi-moon-stars"></i></span>
      <span>The Blue Moon</span>
    </a>

    <nav class="store-nav admin-nav">
      <a href="/" title="Home" aria-label="Home"><i class="bi bi-house-door"></i></a>
      <a href="/shop" title="Shop" aria-label="Shop"><i class="bi bi-grid"></i></a>
      <a href="/admin" title="Dashboard" aria-label="Dashboard"><i class="bi bi-speedometer2"></i></a>
      <a href="/admin/orders" class="active" title="Orders" aria-label="Orders"><i class="bi bi-box-seam"></i></a>
      <a href="/admin/products" title="Products" aria-label="Products"><i class="bi bi-boxes"></i></a>
      <a href="/admin/customers" title="Customers" aria-label="Customers"><i class="bi bi-people"></i></a>
      <a href="/admin/account" title="Account" aria-label="Account"><i class="bi bi-person-circle"></i></a>
    </nav>
  </div>
</header>

<main class="store-container admin-container">

  <div class="page-heading">
    <div>
      <span class="eyebrow">Administration</span>
      <h1>Orders</h1>
      <p>View and manage customer orders.</p>
    </div>
  </div>

  <div id="adminError" class="notice error hidden"></div>

  <section class="admin-toolbar">
    <div class="admin-search">
      <i class="bi bi-search"></i>
      <input id="searchInput" type="search" placeholder="Search order, customer or phone">
    </div>

    <select id="statusFilter">
      <option value="">All order statuses</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>

    <select id="paymentFilter">
      <option value="">All payment statuses</option>
      <option value="unpaid">Unpaid</option>
      <option value="partial">Partial</option>
      <option value="paid">Paid</option>
    </select>

    <button class="button secondary" id="refreshButton" type="button">
      <i class="bi bi-arrow-clockwise"></i>
      Refresh
    </button>
  </section>

  <section class="admin-panel">
    <div class="admin-panel-heading">
      <div>
        <span class="eyebrow">Store</span>
        <h2>All Orders</h2>
      </div>
      <span id="orderCount" class="admin-count">0</span>
    </div>

    <div id="ordersList" class="admin-orders-table">
      <div class="loading-state">Loading orders...</div>
    </div>
  </section>

</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-auth.js"></script>

<script>
let allOrders = [];

async function api(url, options = {}) {
  const response = await window.adminFetch(url, options);

  const body = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(body.detail || "Request failed");
  }

  return body;
}
function money(value) {
  return "Rs. " + Number(value || 0).toLocaleString("en-NP", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function statusClass(value) {
  return "status-" + String(value || "").replaceAll("_", "-");
}

function renderOrders() {
  const container = document.getElementById("ordersList");

  const search =
    document.getElementById("searchInput").value.trim().toLowerCase();

  const status =
    document.getElementById("statusFilter").value;

  const payment =
    document.getElementById("paymentFilter").value;

  let orders = allOrders.filter(order => {
    if (status && order.status !== status) return false;
    if (payment && order.payment_status !== payment) return false;

    if (search) {
      const customer = order.customer || {};

      const text = [
        order.order_no,
        order.phone,
        customer.name,
        customer.email,
        customer.phone
      ].join(" ").toLowerCase();

      if (!text.includes(search)) return false;
    }

    return true;
  });

  document.getElementById("orderCount").textContent = orders.length;

  if (!orders.length) {
    container.innerHTML =
      '<div class="empty-state">No orders match your filters.</div>';
    return;
  }

  container.innerHTML = orders.map(order => {
    const customer = order.customer || {};

    return `
      <a class="admin-order-row"
         href="/admin/order?id=${encodeURIComponent(order.id)}">

        <div class="order-main">
          <strong>${escapeHtml(order.order_no)}</strong>
          <span>
            ${escapeHtml(customer.name || "Customer")}
          </span>
          <small>
            ${new Date(order.created_at).toLocaleString()}
          </small>
        </div>

        <div class="order-meta">
          <span class="status-badge ${statusClass(order.status)}">
            ${escapeHtml(order.status)}
          </span>

          <span class="payment-badge">
            ${escapeHtml(order.payment_status)}
          </span>

          <strong>${money(order.total_amount)}</strong>

          <i class="bi bi-chevron-right"></i>
        </div>

      </a>
    `;
  }).join("");
}

async function loadOrders() {
  const container = document.getElementById("ordersList");
  container.innerHTML =
    '<div class="loading-state">Loading orders...</div>';

  try {
    allOrders = await api("/api/admin/orders");
    renderOrders();
  } catch (error) {
    container.innerHTML = "";
    const box = document.getElementById("adminError");
    box.textContent = error.message;
    box.classList.remove("hidden");
  }
}

document.getElementById("searchInput")
  .addEventListener("input", renderOrders);

document.getElementById("statusFilter")
  .addEventListener("change", renderOrders);

document.getElementById("paymentFilter")
  .addEventListener("change", renderOrders);

document.getElementById("refreshButton")
  .addEventListener("click", loadOrders);

const params = new URLSearchParams(window.location.search);
const initialStatus = params.get("status");

if (initialStatus) {
  document.getElementById("statusFilter").value = initialStatus;
}

loadOrders();
</script>

</body>
</html>
