<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Admin | The Blue Moon</title>
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="store-body">

<header class="store-header">
  <div class="store-header-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><i class="bi bi-moon-stars"></i></span>
      <span>The Blue Moon</span>
    </a>

    <nav class="store-nav admin-nav">
      <a href="/" title="Home"><i class="bi bi-house-door"></i></a>
      <a href="/shop" title="Shop"><i class="bi bi-grid"></i></a>
      <a href="/admin" title="Dashboard"><i class="bi bi-speedometer2"></i></a>
      <a href="/admin/orders" title="Orders"><i class="bi bi-box-seam"></i></a>
      <a href="/admin/products" class="active" title="Products"><i class="bi bi-boxes"></i></a>
      <a href="/admin/customers" title="Customers"><i class="bi bi-people"></i></a>
      <a href="/admin/account" title="Account"><i class="bi bi-person-circle"></i></a>
    </nav>
  </div>
</header>

<main class="store-container admin-container">

  <div class="page-heading">
    <div>
      <span class="eyebrow">Administration</span>
      <h1>Products & Inventory</h1>
      <p>Monitor stock and update product information.</p>
    </div>
  </div>

  <div id="adminError" class="notice error hidden"></div>

  <section class="admin-toolbar">
    <div class="admin-search">
      <i class="bi bi-search"></i>
      <input id="searchInput"
             type="search"
             placeholder="Search product or SKU">
    </div>

    <label class="check-control">
      <input id="lowStockOnly" type="checkbox">
      <span>Low stock only</span>
    </label>

    <button class="button secondary" id="refreshButton">
      <i class="bi bi-arrow-clockwise"></i>
      Refresh
    </button>
  </section>

  <section class="admin-panel">
    <div class="admin-panel-heading">
      <div>
        <span class="eyebrow">Inventory</span>
        <h2>Products</h2>
      </div>
      <span id="productCount" class="admin-count">0</span>
    </div>

    <div id="productsList" class="admin-products-list">
      <div class="loading-state">Loading products...</div>
    </div>
  </section>

</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/admin-auth.js"></script>

<script>
let products = [];

async function api(url, options = {}) {
  const response = await window.adminFetch(url, options);

  const body = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(body.detail || "Request failed");
  }

  return body;
}
function money(value) {
  return "Rs. " + Number(value || 0).toLocaleString("en-NP", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderProducts() {
  const search =
    document.getElementById("searchInput")
      .value.trim().toLowerCase();

  const lowOnly =
    document.getElementById("lowStockOnly").checked;

  const filtered = products.filter(product => {
    if (search) {
      const text =
        `${product.name} ${product.sku}`.toLowerCase();

      if (!text.includes(search)) return false;
    }

    if (lowOnly &&
        product.stock_quantity > product.reorder_level) {
      return false;
    }

    return true;
  });

  document.getElementById("productCount").textContent =
    filtered.length;

  const container =
    document.getElementById("productsList");

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty-state">No products match your filters.</div>';
    return;
  }

  container.innerHTML = filtered.map(product => {
    const low =
      product.stock_quantity <= product.reorder_level;

    return `
      <div class="admin-product-row">

        <div class="admin-product-image">
          ${
            product.image_url
            ? `<img src="${escapeHtml(product.image_url)}"
                    alt="${escapeHtml(product.name)}">`
            : `<i class="bi bi-box"></i>`
          }
        </div>

        <div class="admin-product-info">
          <strong>${escapeHtml(product.name)}</strong>
          <small>SKU: ${escapeHtml(product.sku)}</small>
          <span>${money(product.unit_price)}</span>
        </div>

        <div class="admin-stock">
          <span>Stock</span>
          <strong class="${low ? "stock-warning" : ""}">
            ${product.stock_quantity}
          </strong>
          <small>Reorder: ${product.reorder_level}</small>
        </div>

        <div class="admin-product-status">
          ${
            low
            ? `<span class="stock-badge warning">
                 <i class="bi bi-exclamation-triangle"></i>
                 Low stock
               </span>`
            : `<span class="stock-badge good">
                 <i class="bi bi-check-circle"></i>
                 In stock
               </span>`
          }
        </div>

      </div>
    `;
  }).join("");
}

async function loadProducts() {
  const container =
    document.getElementById("productsList");

  container.innerHTML =
    '<div class="loading-state">Loading products...</div>';

  try {
    products = await api("/api/admin/products");
    renderProducts();
  } catch (error) {
    container.innerHTML = "";

    const box =
      document.getElementById("adminError");

    box.textContent = error.message;
    box.classList.remove("hidden");
  }
}

document.getElementById("searchInput")
  .addEventListener("input", renderProducts);

document.getElementById("lowStockOnly")
  .addEventListener("change", renderProducts);

document.getElementById("refreshButton")
  .addEventListener("click", loadProducts);

loadProducts();
</script>

</body>
</html>
