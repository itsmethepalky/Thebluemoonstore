<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Details — The Blue Moon Store</title>

  <link rel="stylesheet" href="css/store.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth-guard.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<header class="store-header">
  <div class="container store-header-inner">
    <a href="/" class="brand">The Blue Moon</a>

    <nav class="store-nav" aria-label="Main navigation">
  <a href="/" title="Home" aria-label="Home">
    <i class="bi bi-house-door"></i>
    <span>Home</span>
  </a>

  <a href="/shop" title="Shop" aria-label="Shop">
    <i class="bi bi-grid"></i>
    <span>Shop</span>
  </a>

  <a href="/orders" title="My Orders" aria-label="My Orders">
    <i class="bi bi-box-seam"></i>
    <span>Orders</span>
  </a>

  <a href="/cart" class="cart-link" title="Cart" aria-label="Cart">
    <i class="bi bi-cart3"></i>
    <span>Cart</span>
    <span class="cart-count" id="cartCount">0</span>
  </a>

  <a href="/account" title="My Account" aria-label="My Account">
    <i class="bi bi-person-circle"></i>
    <span>Account</span>
  </a>
</nav>
  </div>
</header>

<main class="container account-page">

  <div id="loading" class="account-card">
    Loading order...
  </div>

  <div id="error" class="form-message hidden"></div>

  <section id="orderContent" class="hidden">

    <div class="page-heading">
      <p class="eyebrow">Order Details</p>
      <h1 id="orderNumber"></h1>
      <p id="orderDate"></p>
    </div>

    <div class="account-card">
      <div class="order-card-top">
        <div>
          <span>Status</span>
          <h2 id="orderStatus"></h2>
        </div>

        <div>
          <span>Total</span>
          <h2 id="orderTotal"></h2>
        </div>
      </div>
    </div>

    <div class="account-card">
      <h2>Items</h2>
      <div id="orderItems"></div>
    </div>

    <div class="account-card">
      <h2>Delivery</h2>

      <p>
        <strong>Phone:</strong>
        <span id="orderPhone"></span>
      </p>

      <p>
        <strong>Address:</strong>
        <span id="orderAddress"></span>
      </p>

      <p>
        <strong>Payment:</strong>
        <span id="orderPayment"></span>
      </p>

      <p id="orderNotesRow">
        <strong>Notes:</strong>
        <span id="orderNotes"></span>
      </p>
    </div>

    <a href="/orders" class="btn btn-secondary">
      ← Back to My Orders
    </a>

  </section>

</main>

<script>
const statusLabels = {
  pending: "Pending",
  confirmed: "Confirmed",
  processing: "Processing",
  ready: "Ready",
  out_for_delivery: "Out for Delivery",
  delivered: "Delivered",
  cancelled: "Cancelled",
  returned: "Returned"
};

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMoney(value) {
  return `NPR ${Number(value || 0).toFixed(2)}`;
}

function formatDate(value) {
  if (!value) return "—";

  return new Date(value).toLocaleString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

async function loadOrder() {
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const content = document.getElementById("orderContent");

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("id");

  if (!orderId) {
    loading.classList.add("hidden");
    error.textContent = "No order was specified.";
    error.className = "form-message error";
    return;
  }

  try {
    const { data: sessionData } =
      await window.supabaseClient.auth.getSession();

    const session = sessionData?.session;

    if (!session) {
      window.location.href =
        `/login?redirect=${encodeURIComponent(
          `/order?id=${orderId}`
        )}`;
      return;
    }

    const response = await fetch(
      `/api/account/orders/${encodeURIComponent(orderId)}`,
      {
        headers: {
          Authorization: `Bearer ${session.access_token}`
        }
      }
    );

    if (response.status === 401) {
      window.location.href =
        `/login?redirect=${encodeURIComponent(
          `/order?id=${orderId}`
        )}`;
      return;
    }

    if (response.status === 404) {
      throw new Error("Order not found.");
    }

    if (!response.ok) {
      throw new Error("Unable to load order.");
    }

    const order = await response.json();

    document.getElementById("orderNumber").textContent =
      order.order_no;

    document.getElementById("orderDate").textContent =
      formatDate(order.created_at);

    document.getElementById("orderStatus").textContent =
      statusLabels[order.status] || order.status;

    document.getElementById("orderTotal").textContent =
      formatMoney(order.total_amount);

    document.getElementById("orderPhone").textContent =
      order.phone || "—";

    document.getElementById("orderAddress").textContent =
      order.shipping_address || "—";

    document.getElementById("orderPayment").textContent =
      `${order.payment_method} (${order.payment_status})`;

    if (order.notes) {
      document.getElementById("orderNotes").textContent =
        order.notes;
    } else {
      document.getElementById("orderNotesRow").classList.add("hidden");
    }

    const items = document.getElementById("orderItems");

    items.innerHTML = (order.order_items || []).map(item => {
      const product = item.products || {};

      return `
        <div class="order-item-row">
          <div>
            <strong>${escapeHtml(product.name || "Product")}</strong>
            <p>
              SKU: ${escapeHtml(product.sku || "—")}
            </p>
          </div>

          <div>
            × ${Number(item.quantity)}
          </div>

          <strong>
            ${formatMoney(item.subtotal)}
          </strong>
        </div>
      `;
    }).join("");

    loading.classList.add("hidden");
    content.classList.remove("hidden");

  } catch (err) {
    loading.classList.add("hidden");
    error.textContent = err.message || "Unable to load order.";
    error.className = "form-message error";
  }
}

loadOrder();
</script>


<script>
(function () {
  const path = window.location.pathname.replace(/\/+$/, "") || "/";

  document.querySelectorAll(".store-nav > a").forEach(link => {
    const href = link.getAttribute("href");

    if (!href || href.startsWith("#")) {
      return;
    }

    const normalizedHref =
      href.replace(/\/+$/, "") || "/";

    const isActive =
      normalizedHref === path ||
      (
        normalizedHref === "/shop" &&
        (path === "/product" || path.startsWith("/product/"))
      ) ||
      (
        normalizedHref === "/orders" &&
        (path === "/order" || path.startsWith("/order/"))
      ) ||
      (
        normalizedHref === "/account" &&
        (
          path === "/account" ||
          path === "/checkout" ||
          path === "/login" ||
          path === "/register"
        )
      );

    if (isActive) {
      link.classList.add("active");
      link.setAttribute("aria-current", "page");
    }
  });
})();
</script>

<script src="/js/role-nav.js"></script>
</body>
</html>
