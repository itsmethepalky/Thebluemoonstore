<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — The Blue Moon</title>

  <link rel="stylesheet" href="/css/store.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer>
  </script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<main class="auth-page">
  <section class="auth-card">

    <div class="brand">
      <div class="brand-mark">☾</div>

      <div>
        <h1>The Blue Moon</h1>
        <p>Shop simply. Shop comfortably.</p>
      </div>
    </div>

    <div class="auth-content">

      <h2>Welcome back</h2>

      <p class="muted">
        Sign in to continue.
      </p>

      <form id="loginForm">

        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <div
          id="loginTurnstile"
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAE98GcL_wHI3Vamr">
        </div>

        <button type="submit" id="loginButton">
          Sign in
        </button>

      </form>

      <div id="message" class="message hidden"></div>

      <p class="auth-switch">
        Don't have an account?
        <a href="/register" id="createAccountLink">
          Create one
        </a>
      </p>

    </div>

  </section>
</main>

<script src="/js/supabase.js"></script>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");
const createAccountLink = document.getElementById("createAccountLink");

let turnstileWidgetId = null;


/* -----------------------------------------------------------
   Safe redirect
----------------------------------------------------------- */

function getSafeRedirect() {

  const redirect =
    new URLSearchParams(window.location.search).get("redirect");

  if (
    redirect &&
    redirect.startsWith("/") &&
    !redirect.startsWith("//")
  ) {
    return redirect;
  }

  return null;
}


/* -----------------------------------------------------------
   Messages
----------------------------------------------------------- */

function showMessage(text, error = false) {

  message.textContent = text;

  message.classList.remove(
    "hidden",
    "error",
    "success"
  );

  message.classList.add(
    error ? "error" : "success"
  );
}


/* -----------------------------------------------------------
   Preserve redirect for registration
----------------------------------------------------------- */

(function () {

  const redirect = getSafeRedirect();

  if (redirect && createAccountLink) {

    createAccountLink.href =
      "/register?redirect=" +
      encodeURIComponent(redirect);

  }

})();


/* -----------------------------------------------------------
   Turnstile
----------------------------------------------------------- */

function waitForTurnstile() {

  return new Promise((resolve) => {

    if (
      window.turnstile &&
      typeof window.turnstile.render === "function"
    ) {
      resolve(true);
      return;
    }

    const interval = setInterval(() => {

      if (
        window.turnstile &&
        typeof window.turnstile.render === "function"
      ) {

        clearInterval(interval);
        resolve(true);

      }

    }, 100);

    setTimeout(() => {

      clearInterval(interval);
      resolve(false);

    }, 10000);

  });
}


async function initializeTurnstile() {

  const ready = await waitForTurnstile();

  if (!ready) {

    showMessage(
      "Security verification could not load. Please refresh the page.",
      true
    );

    return;
  }

  const container =
    document.getElementById("loginTurnstile");

  if (!container) {
    return;
  }

  turnstileWidgetId =
    window.turnstile.render(
      container,
      {
        sitekey: container.dataset.sitekey
      }
    );
}


initializeTurnstile();


/* -----------------------------------------------------------
   Get authenticated user's Store role
----------------------------------------------------------- */

async function getUserRole(accessToken) {

  const response = await fetch(
    "/api/auth/me",
    {
      headers: {
        Authorization: "Bearer " + accessToken,
        Accept: "application/json"
      }
    }
  );

  if (!response.ok) {

    const body =
      await response.json().catch(() => ({}));

    throw new Error(
      body.detail || "Unable to verify account"
    );
  }

  return response.json();
}


/* -----------------------------------------------------------
   Redirect based on role
----------------------------------------------------------- */

async function redirectAfterLogin(accessToken) {

  const user = await getUserRole(accessToken);

  const role =
    String(user.role || "").toLowerCase();

  const requestedRedirect =
    getSafeRedirect();


  /* ADMIN */

  if (role === "admin") {

    if (
      requestedRedirect &&
      (
        requestedRedirect === "/admin" ||
        requestedRedirect.startsWith("/admin/")
      )
    ) {

      window.location.replace(requestedRedirect);

    } else {

      window.location.replace("/admin");

    }

    return;
  }


  /* CUSTOMER */

  if (role === "customer") {

    if (requestedRedirect) {

      window.location.replace(requestedRedirect);

    } else {

      window.location.replace("/");

    }

    return;
  }


  /* Unknown / unsupported role */

  await window.supabaseClient.auth.signOut();

  throw new Error(
    "This account does not have a valid Store role."
  );
}


/* -----------------------------------------------------------
   LOGIN
----------------------------------------------------------- */

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (turnstileWidgetId === null) {

    showMessage(
      "Please wait for the security check to load.",
      true
    );

    return;
  }

  const captchaToken =
    window.turnstile.getResponse(
      turnstileWidgetId
    );

  if (!captchaToken) {

    showMessage(
      "Please complete the security check.",
      true
    );

    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";
  message.classList.add("hidden");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try {

    const { data, error } =
      await window.supabaseClient.auth.signInWithPassword({
        email,
        password,
        options: {
          captchaToken
        }
      });

    if (error) {
      throw error;
    }

    const accessToken =
      data.session?.access_token;

    if (!accessToken) {

      throw new Error(
        "Login succeeded but no authentication session was returned."
      );
    }

    showMessage("Signed in successfully.");

    await redirectAfterLogin(accessToken);

  } catch (error) {

    console.error("Login error:", error);

    showMessage(
      error.message || "Unable to sign in.",
      true
    );

    if (
      turnstileWidgetId !== null &&
      window.turnstile
    ) {

      window.turnstile.reset(
        turnstileWidgetId
      );

    }

  } finally {

    button.disabled = false;
    button.textContent = "Sign in";

  }

});

</script>

<script src="/js/role-nav.js"></script>
</body>
</html>
