<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Forgot Password — The Blue Moon</title>

  <link
    rel="stylesheet"
    href="/css/store.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer>
  </script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<main class="auth-page">

  <section class="auth-card">

    <div class="brand">

      <div class="brand-mark">
        <i class="bi bi-moon-stars-fill"></i>
      </div>

      <div>
        <h1>The Blue Moon</h1>
        <p>EVERYDAY ESSENTIALS</p>
      </div>

    </div>


    <div class="auth-content">

      <div class="auth-heading-icon">
        <i class="bi bi-shield-lock"></i>
      </div>

      <h2>Reset your password</h2>

      <p class="muted">
        Enter the email address connected to your account and
        we'll send you a secure password reset link.
      </p>


      <form id="forgotPasswordForm">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="you@example.com"
          required>


        <div
          id="forgotTurnstile"
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAE98GcL_wHI3Vamr">
        </div>


        <button
          type="submit"
          id="forgotButton">

          <i class="bi bi-envelope-arrow-up"></i>
          Send reset link

        </button>

      </form>


      <div
        id="message"
        class="message hidden"
        role="status"
        aria-live="polite">
      </div>


      <p class="auth-switch">

        Remember your password?

        <a href="/login">
          Sign in
        </a>

      </p>


      <p class="auth-switch auth-secondary-link">

        Don't have an account?

        <a href="/register">
          Create one
        </a>

      </p>

    </div>

  </section>

</main>


<script src="/js/supabase.js"></script>

<script>

const form =
  document.getElementById(
    "forgotPasswordForm"
  );

const button =
  document.getElementById(
    "forgotButton"
  );

const message =
  document.getElementById(
    "message"
  );

let turnstileWidgetId = null;


/* -----------------------------------------------------------
   Safe redirect
----------------------------------------------------------- */

function getSafeRedirect() {

  const redirect =
    new URLSearchParams(
      window.location.search
    ).get("redirect");

  if (
    redirect &&
    redirect.startsWith("/") &&
    !redirect.startsWith("//")
  ) {
    return redirect;
  }

  return null;
}


/* -----------------------------------------------------------
   Messages
----------------------------------------------------------- */

function showMessage(
  text,
  error = false
) {

  message.textContent =
    text;

  message.classList.remove(
    "hidden",
    "error",
    "success"
  );

  message.classList.add(
    error
      ? "error"
      : "success"
  );

}


/* -----------------------------------------------------------
   Turnstile
----------------------------------------------------------- */

function waitForTurnstile() {

  return new Promise(
    (resolve) => {

      if (
        window.turnstile &&
        typeof window.turnstile.render ===
          "function"
      ) {

        resolve(true);
        return;

      }


      const interval =
        setInterval(() => {

          if (
            window.turnstile &&
            typeof window.turnstile.render ===
              "function"
          ) {

            clearInterval(
              interval
            );

            resolve(true);

          }

        }, 100);


      setTimeout(() => {

        clearInterval(
          interval
        );

        resolve(false);

      }, 10000);

    }
  );

}


async function initializeTurnstile() {

  const ready =
    await waitForTurnstile();


  if (!ready) {

    showMessage(
      "Security verification could not load. Please refresh the page.",
      true
    );

    return;

  }


  const container =
    document.getElementById(
      "forgotTurnstile"
    );


  if (!container) {
    return;
  }


  turnstileWidgetId =
    window.turnstile.render(
      container,
      {
        sitekey:
          container.dataset.sitekey
      }
    );

}


initializeTurnstile();


/* -----------------------------------------------------------
   PASSWORD RESET REQUEST
----------------------------------------------------------- */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    if (
      turnstileWidgetId === null
    ) {

      showMessage(
        "Please wait for the security check to load.",
        true
      );

      return;

    }


    const captchaToken =
      window.turnstile.getResponse(
        turnstileWidgetId
      );


    if (!captchaToken) {

      showMessage(
        "Please complete the security check.",
        true
      );

      return;

    }


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    button.disabled =
      true;

    button.innerHTML =
      '<i class="bi bi-hourglass-split"></i> Sending...';

    message.classList.add(
      "hidden"
    );


    try {

      const redirect =
        getSafeRedirect();


      const redirectUrl =
        new URL(
          "/reset-password",
          window.location.origin
        );


      if (redirect) {

        redirectUrl.searchParams.set(
          "redirect",
          redirect
        );

      }


      const {
        error
      } =
        await window.supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                redirectUrl.toString(),

              captchaToken
            }
          );


      if (error) {
        throw error;
      }


      /*
       * Do not reveal whether the email exists.
       * This prevents account-enumeration through the
       * password-reset form.
       */
      showMessage(
        "If an account exists for that email, a password reset link has been sent. Please check your inbox and spam folder."
      );


      form.reset();


    } catch (error) {

      console.error(
        "Password reset request error:",
        error
      );


      showMessage(
        "We couldn't process that request right now. Please try again.",
        true
      );


    } finally {

      button.disabled =
        false;

      button.innerHTML =
        '<i class="bi bi-envelope-arrow-up"></i> Send reset link';


      if (
        turnstileWidgetId !== null &&
        window.turnstile
      ) {

        window.turnstile.reset(
          turnstileWidgetId
        );

      }

    }

  }
);

</script>

<script src="/js/role-nav.js"></script>

</body>
</html>
