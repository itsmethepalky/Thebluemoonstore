<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set New Password — The Blue Moon</title>

  <link rel="stylesheet" href="/css/store.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="/js/supabase.js"></script>

</head>

<body>

  <main class="auth-page">

    <section class="auth-card" aria-labelledby="resetPasswordTitle">

      <div class="brand">

        <div class="brand-mark" aria-hidden="true">
          <i class="bi bi-moon-stars-fill"></i>
        </div>

        <div>
          <h1>The Blue Moon</h1>
          <p>EVERYDAY ESSENTIALS</p>
        </div>

      </div>

      <div class="auth-content">

        <div class="auth-heading-icon" aria-hidden="true">
          <i class="bi bi-shield-check"></i>
        </div>

        <h2 id="resetPasswordTitle">
          Set a new password
        </h2>

        <p class="muted">
          Choose a new password for your The Blue Moon account.
        </p>

        <div
          id="recoveryLoading"
          class="message"
          role="status"
          aria-live="polite">
          <i class="bi bi-arrow-repeat"></i>
          Verifying your secure reset session...
        </div>

        <form
          id="resetPasswordForm"
          class="hidden"
          novalidate>

          <label for="password">
            New password
          </label>

          <div class="password-field">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              placeholder="Create a new password"
              required>

            <button
              type="button"
              class="password-toggle"
              data-password-target="password"
              aria-label="Show password"
              aria-pressed="false">

              <i class="bi bi-eye"></i>

            </button>

          </div>

          <label for="confirmPassword">
            Confirm new password
          </label>

          <div class="password-field">

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              placeholder="Enter your new password again"
              required>

            <button
              type="button"
              class="password-toggle"
              data-password-target="confirmPassword"
              aria-label="Show password"
              aria-pressed="false">

              <i class="bi bi-eye"></i>

            </button>

          </div>

          <p class="password-hint">
            Use at least 6 characters. A longer password is recommended.
          </p>

          <button
            type="submit"
            id="resetButton">

            <i class="bi bi-check2-circle"></i>
            <span>Update password</span>

          </button>

        </form>

        <div
          id="message"
          class="message hidden"
          role="status"
          aria-live="polite">
        </div>

        <p class="auth-switch">
          <a
            href="/login"
            id="loginLink">
            <i class="bi bi-arrow-left"></i>
            Return to sign in
          </a>
        </p>

      </div>

    </section>

  </main>

  <script>

    const form =
      document.getElementById(
        "resetPasswordForm"
      );

    const button =
      document.getElementById(
        "resetButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const recoveryLoading =
      document.getElementById(
        "recoveryLoading"
      );

    const password =
      document.getElementById(
        "password"
      );

    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      );

    const loginLink =
      document.getElementById(
        "loginLink"
      );

    let recoverySessionReady =
      false;


    /* ---------------------------------------------------------
       Safe redirect
    --------------------------------------------------------- */

    function getSafeRedirect() {

      const redirect =
        new URLSearchParams(
          window.location.search
        ).get("redirect");

      if (
        redirect &&
        redirect.startsWith("/") &&
        !redirect.startsWith("//")
      ) {

        return redirect;

      }

      return null;

    }


    /* ---------------------------------------------------------
       Preserve safe redirect for Login
    --------------------------------------------------------- */

    (function () {

      const redirect =
        getSafeRedirect();

      if (
        redirect &&
        loginLink
      ) {

        loginLink.href =
          "/login?redirect=" +
          encodeURIComponent(
            redirect
          );

      }

    })();


    /* ---------------------------------------------------------
       Messages
    --------------------------------------------------------- */

    function showMessage(
      text,
      error = false
    ) {

      message.textContent =
        text;

      message.classList.remove(
        "hidden",
        "error",
        "success"
      );

      message.classList.add(
        error
          ? "error"
          : "success"
      );

    }


    /* ---------------------------------------------------------
       Password visibility
    --------------------------------------------------------- */

    function initializePasswordToggles() {

      document
        .querySelectorAll(
          ".password-toggle"
        )
        .forEach((toggle) => {

          toggle.addEventListener(
            "click",
            () => {

              const targetId =
                toggle.dataset.passwordTarget;

              const input =
                document.getElementById(
                  targetId
                );

              if (!input) {
                return;
              }

              const showing =
                input.type === "text";

              input.type =
                showing
                  ? "password"
                  : "text";

              toggle.setAttribute(
                "aria-pressed",
                String(!showing)
              );

              toggle.setAttribute(
                "aria-label",
                showing
                  ? "Show password"
                  : "Hide password"
              );

              const icon =
                toggle.querySelector(
                  "i"
                );

              if (icon) {

                icon.className =
                  showing
                    ? "bi bi-eye"
                    : "bi bi-eye-slash";

              }

            }
          );

        });

    }


    initializePasswordToggles();


    /* ---------------------------------------------------------
       Button state
    --------------------------------------------------------- */

    function setButtonLoading(
      loading
    ) {

      button.disabled =
        loading;

      const icon =
        button.querySelector("i");

      const text =
        button.querySelector("span");

      if (loading) {

        if (icon) {
          icon.className =
            "bi bi-hourglass-split";
        }

        if (text) {
          text.textContent =
            "Updating...";
        }

      } else {

        if (icon) {
          icon.className =
            "bi bi-check2-circle";
        }

        if (text) {
          text.textContent =
            "Update password";
        }

      }

    }


    /* ---------------------------------------------------------
       Recovery session
    --------------------------------------------------------- */

    async function initializeRecovery() {

      try {

        /*
         * Supabase establishes the recovery session
         * from the password-reset link. We wait for
         * that session instead of immediately assuming
         * the link is invalid.
         */
        const session =
          await window.getStableSession({
            retries: 10,
            delay: 300
          });

        recoveryLoading.classList.add(
          "hidden"
        );

        if (!session) {

          showMessage(
            "This password reset link is invalid or has expired. Please request a new one.",
            true
          );

          return;

        }

        recoverySessionReady =
          true;

        form.classList.remove(
          "hidden"
        );

        password.focus();

      } catch (error) {

        console.error(
          "RESET PASSWORD: recovery session check failed",
          error
        );

        recoveryLoading.classList.add(
          "hidden"
        );

        showMessage(
          "We couldn't verify this password reset link. Please request a new one.",
          true
        );

      }

    }


    initializeRecovery();


    /* ---------------------------------------------------------
       Password update
    --------------------------------------------------------- */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.classList.add(
          "hidden"
        );

        if (!recoverySessionReady) {

          showMessage(
            "Please wait while your secure reset session is verified.",
            true
          );

          return;

        }

        const newPassword =
          password.value;

        const confirmedPassword =
          confirmPassword.value;

        if (newPassword.length < 6) {

          showMessage(
            "Your password must be at least 6 characters.",
            true
          );

          password.focus();

          return;

        }

        if (
          newPassword !==
          confirmedPassword
        ) {

          showMessage(
            "Passwords do not match.",
            true
          );

          confirmPassword.focus();

          return;

        }

        setButtonLoading(true);

        try {

          const {
            error
          } =
            await window.supabaseClient.auth
              .updateUser({
                password:
                  newPassword
              });

          if (error) {
            throw error;
          }

          showMessage(
            "Your password has been updated successfully."
          );

          form.reset();

          /*
           * End the recovery session after the
           * password has been changed. The user
           * signs in normally with the new password.
           */
          setTimeout(
            async () => {

              try {

                await window.supabaseClient.auth
                  .signOut();

              } catch (signOutError) {

                console.warn(
                  "RESET PASSWORD: sign-out after reset failed",
                  signOutError
                );

              }

              const redirect =
                getSafeRedirect();

              if (redirect) {

                window.location.replace(
                  "/login?redirect=" +
                  encodeURIComponent(
                    redirect
                  )
                );

              } else {

                window.location.replace(
                  "/login"
                );

              }

            },
            1200
          );

        } catch (error) {

          console.error(
            "RESET PASSWORD: update failed",
            error
          );

          showMessage(
            "We couldn't update your password. The reset link may have expired. Please request a new one.",
            true
          );

          setButtonLoading(false);

        }

      }
    );

  </script>

  <script src="/js/role-nav.js"></script>

</body>
</html>
